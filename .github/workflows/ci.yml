name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies: the calendar modules are deliberately Qt-free so they
      # can be exercised under plain node.
      - name: Calendar arithmetic
        run: node tests/bikram.test.js

      - name: Manifest is valid JSON and declares what the shell needs
        run: |
          node -e '
            const m = require("./manifest.json");
            const need = ["schemaVersion", "id", "name", "version", "kinds", "entryPoints"];
            const missing = need.filter(k => !(k in m));
            if (missing.length) throw new Error("manifest missing: " + missing.join(", "));
            if (!m.entryPoints.barWidget) throw new Error("no barWidget entry point");
            const fs = require("fs");
            for (const f of Object.values(m.entryPoints)) {
              if (!fs.existsSync(f)) throw new Error("entry point not found: " + f);
            }
            console.log("manifest ok:", m.id, m.version);
          '

      # A syntax check only. qmllint is no use here: it cannot resolve the
      # Quickshell `qs.*` imports and passes files with real errors in them, so
      # it would be a false green. qmlformat at least fails on a parse error.
      - name: QML parses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools

          # Debian and Ubuntu keep Qt 6 tools off PATH, under /usr/lib/qt6/bin.
          qmlformat=$(command -v qmlformat || true)
          if [ -z "$qmlformat" ]; then
            qmlformat=$(find /usr/lib/qt6 /usr/lib/*/qt6 -name qmlformat -type f 2>/dev/null | head -1)
          fi
          if [ -z "$qmlformat" ]; then
            echo "::error::qmlformat not found — the QML syntax check would silently pass"
            exit 1
          fi
          echo "using $qmlformat"

          status=0
          for f in *.qml; do
            if "$qmlformat" "$f" > /dev/null; then
              echo "  ok   $f"
            else
              echo "::error file=$f::$f failed to parse"
              status=1
            fi
          done
          exit $status
